name: Validate canvas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate model, generator, and reproducible demo
        run: python3 -m unittest discover -s tests -v
      - name: Check generated JavaScript and graph layering
        run: node tests/check-canvas.mjs
