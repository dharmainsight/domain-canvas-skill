<script>
'use strict';
(() => {
const model=JSON.parse(document.getElementById('model').textContent);
const $=id=>document.getElementById(id);
const viewport=$('viewport'),stage=$('stage'),svg=$('edges'),nodes=$('nodes');
const entityMap=new Map(model.entities.map(e=>[e.id,e]));
const screenMap=new Map(model.screens.map(s=>[s.id,s]));
const groupMap=new Map(model.concept_groups.map(g=>[g.id,g]));
const roles={primary:'主対象',context:'関連情報',collection:'一覧',edit:'更新',create:'作成'};
const confidenceNames={confirmed:'確認済み',inferred:'推論を含む',illustrative:'説明用の仮定',unknown:'未確認'};
const views=[
{id:'design',name:'画面',group:'構造',source:'screens',title:'画面で扱うものを、業務の言葉につなぐ',description:'画面と、その画面が表示・更新する対象を対応付けます。'},
{id:'concept',name:'概念',group:'構造',source:'entities',title:'登場するものと、その関係をつかむ',description:'名前と業務上の意味を中心に、対象同士のつながりを読みます。'},
{id:'er',name:'ER',group:'構造',source:'entities',title:'データの構造と制約を確認する',description:'キーと参照関係を先に表示。全属性・NULL可否は項目を選んで確認できます。'},
{id:'lifecycle',name:'状態遷移',group:'ふるまい',source:'state_machines',title:'どの条件で、次の状態へ進むか',description:'状態、変更のきっかけ、戻り道を分けて確認します。'},
{id:'sequence',name:'シーケンス',group:'ふるまい',source:'scenarios',title:'保存・応答・通知の順序をたどる',description:'一つのシナリオに絞り、呼び出し順序と処理の境界を読みます。'},
{id:'service',name:'業務と体験',group:'ふるまい',source:'journeys',title:'顧客の体験を、裏側の仕事につなぐ',description:'同じ段階の顧客行動・接点・担当業務を縦に対応付けます。'},
{id:'lineage',name:'リネージュ',group:'測定',source:'lineage',title:'数値の出所と、加工の過程をたどる',description:'入力データ、変換、出力を区別し、集計粒度と根拠を確認します。'},
{id:'outcome',name:'KPI',group:'測定',source:'outcomes',title:'成果を、検討できる要素へ分解する',description:'同じ母集団・観測期間の数値を使い、結果と構成要素を対応付けます。'}
];
let current='concept',scope='',selected=null,bundle=null,graphItems=[],graphEdges=[],nodeMap=new Map(),detailsMap=new Map();
let scale=1,tx=32,ty=32,graphWidth=800,graphHeight=520,drag=null,renderToken=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
function tag(name,attrs={},parent=svg){const n=document.createElementNS('http://www.w3.org/2000/svg',name);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);parent.appendChild(n);return n;}
function svgText(x,y,label,className='edge-text',anchor='middle'){const t=tag('text',{x,y,class:className,'text-anchor':anchor});t.textContent=label;return t;}
function wrapLabel(label,width=130){const result=[];let line='',len=0;for(const c of String(label??'')){const n=c.codePointAt(0)>255?12:6.5;if(len+n>width&&line){result.push(line);line='';len=0;}line+=c;len+=n;}if(line)result.push(line);return result;}
function labelAt(x,y,label,width=130){const ls=wrapLabel(label,width);return ls.map((t,i)=>svgText(x,y+i*17,t));}
function metaConfidence(item){return item?.confidence||bundle?.confidence||'unknown';}
function fmt(value,unit){if(value===undefined||value===null)return '未定義';const v=unit==='%'?value*100:value;return new Intl.NumberFormat('ja-JP',{maximumFractionDigits:Math.abs(v)<1?3:2}).format(v);}
function entityLinks(ids=[]){return [...new Set(ids)].filter(id=>entityMap.has(id));}
function record(id,title,kind,description,extra={}){return {id,title,kind,description,...extra};}
function entityRecord(e){
 const relationships=model.relationships.filter(r=>r.from===e.id||r.to===e.id).map(r=>`${entityMap.get(r.from)?.name||r.from} → ${entityMap.get(r.to)?.name||r.to}：${r.label||''}\n${r.from_cardinality} → ${r.to_cardinality} ／ ${confidenceNames[r.confidence||'unknown']}\n${r.evidence||'根拠未登録'}`).join('\n\n');
 return record(e.id,e.name||e.id,'業務の対象',e.description,{raw:e,entityIds:[e.id],fields:{'グループ':groupMap.get(e.group)?.name,'識別子':e.id,'根拠':e.evidence,'関連と根拠':relationships}});
}
function register(key,item){detailsMap.set(key,item);return key;}
function makeCard(item){
 const card=document.createElement('article');card.className='node '+(item.className||'');card.dataset.nodeId=item.id;card.style.width=(item.width||224)+'px';

function service(){bundle=(model.journeys||[]).find(j=>j.id===scope);if(!bundle)return empty();viewport.hidden=true;$('table-surface').hidden=false;let content='<table class="blueprint"><caption class="sr-only">'+esc(bundle.name)+'</caption><thead><tr><th scope="col">役割・接点</th>'+bundle.steps.map((s,i)=>`<th scope="col"><span class="step-number">${String(i+1).padStart(2,'0')}</span>${esc(s.name)}</th>`).join('')+'</tr></thead><tbody>';for(const lane of bundle.lanes){if(lane.boundary_before)content+=`<tr class="boundary"><td colspan="${bundle.steps.length+1}">${esc(lane.boundary_before)}</td></tr>`;content+=`<tr><th scope="row">${esc(lane.name)}</th>`;for(const step of bundle.steps){const cells=bundle.cells.filter(c=>c.lane===lane.id&&c.step===step.id);content+='<td>'+cells.map(c=>{const detail=record(c.id,c.name,lane.name,c.description,{raw:c,entityIds:c.entity_ids,fields:{'段階':step.name,'接点の画面':(c.screen_ids||[]).map(id=>screenMap.get(id)?.name),'根拠':c.evidence||bundle.evidence}});register(c.id,detail);return`<button type="button" class="process-card" data-select="${esc(c.id)}">${esc(c.name)}${c.note?'<span class="process-note">'+esc(c.note)+'</span>':''}</button>`;}).join('')+(cells.length?'':'<span aria-label="未定義">—</span>')+'</td>';}content+='</tr>';}content+='</tbody></table>';$('table-surface').innerHTML=content;$('table-surface').querySelectorAll('[data-select]').forEach(b=>b.addEventListener('click',()=>inspect(detailsMap.get(b.dataset.select),b.dataset.select)));$('view-count').textContent=`${bundle.steps.length}段階 · ${bundle.lanes.length}レーン`;$('legend').textContent='横は段階順、縦は同じ段階の役割。所要時間は表しません。— は未定義。';}
function lineage(){bundle=(model.lineage||[]).find(l=>l.id===scope);if(!bundle)return empty();const items=[];for(const d of bundle.datasets){register(d.id,record(d.id,d.name,'データセット',d.description,{raw:d,entityIds:d.entity_id?[d.entity_id]:[],fields:{'一行の意味':d.grain,'根拠':d.evidence||bundle.evidence}}));items.push({id:d.id,title:d.name,kind:'データセット',caption:d.grain||d.description,width:238});}const edges=[];for(const j of bundle.jobs){register(j.id,record(j.id,j.name,'変換処理',j.description,{raw:j,entityIds:bundle.entity_ids,fields:{'入力':j.inputs.map(id=>bundle.datasets.find(d=>d.id===id)?.name),'出力':j.outputs.map(id=>bundle.datasets.find(d=>d.id===id)?.name),'集計条件':j.rule,'根拠':j.evidence||bundle.evidence}}));items.push({id:j.id,title:j.name,kind:'変換処理',caption:j.description,width:230,className:'is-job'});j.inputs.forEach(id=>edges.push({from:id,to:j.id,label:'入力'}));j.outputs.forEach(id=>edges.push({from:j.id,to:id,label:'出力'}));}renderGraph(items,edges);$('view-count').textContent=`${bundle.datasets.length}データ · ${bundle.jobs.length}処理`;$('legend').textContent='データ → 変換 → データ。列の参照とデータの生成過程は区別します。';}
function outcome(){bundle=(model.outcomes||[]).find(o=>o.id===scope);if(!bundle)return empty();const metricMap=new Map(bundle.metrics.map(m=>[m.id,m])),reachable=new Set();function walk(id){if(reachable.has(id))return;reachable.add(id);(metricMap.get(id).inputs||[]).forEach(walk);}walk(bundle.root);const values=model.computed_outcomes[bundle.id];const items=bundle.metrics.filter(m=>reachable.has(m.id)).map(m=>{register(m.id,record(m.id,m.name,m.operator?'分解した指標':'入力する指標',m.description,{raw:m,entityIds:m.entity_ids,fields:{'値':fmt(values[m.id],m.unit)+m.unit,'母集団':bundle.population,'観測期間':bundle.window,'分解方法':m.operator?{product:'入力の積',sum:'入力の和',ratio:'第1入力 ÷ 第2入力'}[m.operator]:undefined,'入力':m.inputs?.map(id=>metricMap.get(id).name),'根拠':m.evidence||bundle.evidence}}));return{id:m.id,title:m.name,kind:m.id===bundle.root?'成果':m.operator?'構成要素':'入力',value:values[m.id],unit:m.unit,caption:m.description,width:m.id===bundle.root?250:226,className:m.id===bundle.root?'is-root':''};});const edges=bundle.metrics.filter(m=>reachable.has(m.id)).flatMap(m=>(m.inputs||[]).map(id=>({from:m.id,to:id,label:{product:'積の要素',sum:'和の要素',ratio:'比率の要素'}[m.operator],arrow:false})));renderGraph(items,edges);$('scope-note').hidden=false;$('scope-note').innerHTML=`<span>母集団：<b>${esc(bundle.population)}</b></span><span>観測期間：<b>${esc(bundle.window)}</b></span>`;$('view-count').textContent=`${items.length}指標`;$('legend').textContent='数値はモデルの定義式から算出。線は算術的な分解を表します。';$('footer-note').textContent='比率の分母と観測期間をそろえて解釈してください。この分解だけでは施策の因果効果は分かりません。';}
function empty(){$('legend').textContent='';viewport.hidden=true;$('empty-state').hidden=false;$('empty-state').innerHTML='<h2>この観点の情報はまだありません</h2><p>必要な対象・関係・根拠を追加すると、この図を表示できます。</p>';$('view-count').textContent='未定義';}
function optionsFor(view){if(view==='concept'||view==='er')return [{id:'',name:'すべての対象'},...model.entities];const config=views.find(v=>v.id===view);return model[config.source]||[];}
function buildNavigation(){const nav=$('navigation'),mobile=$('mobile-view');nav.replaceChildren();mobile.replaceChildren();for(const group of ['構造','ふるまい','測定']){const section=document.createElement('section');section.className='nav-group';const h=document.createElement('h2');h.textContent=group;section.appendChild(h);const optgroup=document.createElement('optgroup');optgroup.label=group;for(const v of views.filter(v=>v.group===group)){const i=views.indexOf(v),count=(model[v.source]||[]).length;const button=document.createElement('button');button.type='button';button.className='nav-button';button.dataset.view=v.id;button.innerHTML=`<span class="nav-number">${String(i+1).padStart(2,'0')}</span>${esc(v.name)}<span class="count">${count||'—'}</span>`;button.addEventListener('click',()=>navigate(v.id));section.appendChild(button);const option=document.createElement('option');option.value=v.id;option.textContent=v.name+(count?'':' · 未定義');optgroup.appendChild(option);}nav.appendChild(section);mobile.appendChild(optgroup);}}
function navigate(view,nextScope,fromHash=false){if(!views.some(v=>v.id===view))view='concept';current=view;const options=optionsFor(view);scope=nextScope!==undefined&&options.some(o=>o.id===nextScope)?nextScope:(options[0]?.id||'');closeDetail();$('case-select').replaceChildren();options.forEach(o=>{const option=document.createElement('option');option.value=o.id;option.textContent=o.name||o.id;$('case-select').appendChild(option);});$('case-select').value=scope;$('case-select').disabled=!options.length;$('mobile-view').value=current;$('navigation').querySelectorAll('[data-view]').forEach(b=>{if(b.dataset.view===current)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});const config=views.find(v=>v.id===current);$('view-eyebrow').textContent=config.group+' / '+config.name;$('view-title').textContent=config.title;$('view-description').textContent=config.description;render();if(!fromHash){const hash=new URLSearchParams({view:current,scope}).toString();history.replaceState(null,'','#'+hash);}}
function render(){renderToken++;nodes.replaceChildren();svg.replaceChildren();nodeMap=new Map();detailsMap=new Map();graphItems=[];graphEdges=[];bundle=null;defs();viewport.hidden=false;$('table-surface').hidden=true;$('table-surface').replaceChildren();$('empty-state').hidden=true;$('scope-note').hidden=true;$('footer-note').textContent=model.is_example?'状態・業務・測定値を含む説明用モデルです。実際の業務・実績を表すものではありません。':'';const handlers={design,concept:structure,er:structure,lifecycle,sequence,service,lineage,outcome};handlers[current]();const confidence=bundle?.confidence||(current==='concept'||current==='er'?'confirmed':'unknown');const state=$('evidence-state');state.textContent=current==='concept'||current==='er'?'項目を選択して根拠を確認':confidenceNames[confidence];state.dataset.confidence=confidence;}
$('case-select').addEventListener('change',()=>navigate(current,$('case-select').value));$('mobile-view').addEventListener('change',()=>navigate($('mobile-view').value));$('show-summary').addEventListener('click',()=>inspect(record('summary',bundle?.name||views.find(v=>v.id===current).name,'図の前提',bundle?.description||views.find(v=>v.id===current).description,{raw:bundle||{},entityIds:bundle?.entity_ids||(bundle?.entity_id?[bundle.entity_id]:[]),fields:{'確度':bundle?confidenceNames[bundle.confidence||'unknown']:undefined,'根拠':bundle?.evidence,'母集団':bundle?.population,'観測期間':bundle?.window,'補足':bundle?.note}})));
$('fit').addEventListener('click',()=>fit(true));$('readable').addEventListener('click',()=>fit(false));$('zoom-in').addEventListener('click',()=>zoom(1.15));$('zoom-out').addEventListener('click',()=>zoom(1/1.15));
viewport.addEventListener('wheel',e=>{if(e.target.closest('.toolbar'))return;e.preventDefault();if(e.ctrlKey||e.metaKey){const rect=viewport.getBoundingClientRect();zoom(e.deltaY<0?1.08:1/1.08,e.clientX-rect.left,e.clientY-rect.top);}else{tx-=e.deltaX;ty-=e.deltaY;applyTransform();}},{passive:false});
viewport.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button,iframe'))return;drag={x:e.clientX,y:e.clientY,tx,ty,id:e.pointerId};viewport.setPointerCapture(e.pointerId);viewport.classList.add('is-dragging');});viewport.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;applyTransform();});function endDrag(){drag=null;viewport.classList.remove('is-dragging');}viewport.addEventListener('pointerup',endDrag);viewport.addEventListener('pointercancel',endDrag);viewport.addEventListener('lostpointercapture',endDrag);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});window.addEventListener('hashchange',()=>{const params=new URLSearchParams(location.hash.slice(1));navigate(params.get('view')||'concept',params.get('scope')||'',true);});let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{closeDetail();render();},100);});
$('example-label').hidden=!model.is_example;buildNavigation();const params=new URLSearchParams(location.hash.slice(1));navigate(params.get('view')||'concept',params.get('scope')||'',true);
})();
</script>
